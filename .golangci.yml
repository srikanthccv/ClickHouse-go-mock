version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nlreturn
    - prealloc
    - staticcheck
    - unconvert
    - unused
    - wsl_v5
  settings:
    funlen:
      lines: 70
      statements: 50
    gosec:
      excludes:
        - G115
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - goconst
          - lll
          - staticcheck
          - wsl_v5
        path: (.+)_test\.go
    # copied from clickhouse-go; kept close to upstream
    paths:
      - rows_column_type\.go
      - scan\.go
      - struct_map\.go
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax